name: Publish to npm

on:
  push:
    branches:
      - main

concurrency:
  group: publish-npm
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  publish:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Bump patch versions
        shell: bash
        run: |
          set -euo pipefail
          # If git is behind the registry (e.g. manual publish or failed push after publish),
          # a single `npm version patch` can land on an already-published version.
          align_if_behind() {
            local pkg="$1"
            local dir="$2"
            local pub cur
            pub=$(npm view "$pkg" version 2>/dev/null || echo "0.0.0")
            cur=$(node -p "require('./$dir/package.json').version")
            if [ "$(printf '%s\n' "$cur" "$pub" | sort -V | head -n1)" = "$cur" ] && [ "$cur" != "$pub" ]; then
              echo "Aligning $pkg from $cur to registry $pub before bump"
              npm pkg set "version=$pub" -w "$pkg"
            fi
          }
          align_if_behind "@fireimg/js" "packages/fireimg-js"
          align_if_behind "@fireimg/react" "packages/fireimg-react"
          npm install
          npm version patch --no-git-tag-version -w @fireimg/js
          npm version patch --no-git-tag-version -w @fireimg/react

      - name: Publish @fireimg/js
        run: npm publish -w @fireimg/js --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @fireimg/react
        run: npm publish -w @fireimg/react --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -u
          git commit -m "chore: bump versions [skip ci]"
          git push
